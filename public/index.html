<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" sizes="48x48" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0c0c0c" />
    <meta name="color-scheme" content="dark" />
    <meta
      name="description"
      content="Charles Miguel Henville. Computer engineer, developer and creator. Projects, music and procedural VFX tools."
    />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600&display=swap"
    />
    <style>
      /* Paper grain. Lives here (not in the bundle) so it paints before JS
         and can reference PUBLIC_URL. The tile is a light-only overlay with
         alpha, so it sits faintly over anything, including blurred glass. */
      html, body { background: #0c0c0c; }
      body::before,
      .paper-grain::before {
        content: '';
        position: fixed;
        inset: 0;
        pointer-events: none;
        background: url('%PUBLIC_URL%/assets/paper_grain.webp') 0 0 / 768px 768px repeat;
      }
      body::before {
        z-index: -1;
        opacity: 0.35;
      }
      /* grain inside a positioned surface (e.g. the menu glass) */
      .paper-grain::before {
        position: absolute;
        z-index: 0;
        opacity: 0.45;
      }
    </style>
    <title>Charles Miguel Henville</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
